name: Greenhouse AI Operator
version: "0.1.0"
slug: greenhouse_webui
description: Chat front end for the Greenhouse AI Operator (Open WebUI), using models from OpenRouter
url: https://github.com/dancingcactus/smart-agricultural-greenhouse-engine
arch: [aarch64, amd64]
startup: application
boot: auto
# Open WebUI cannot run under a path prefix, so it cannot use Home Assistant's sidebar (ingress).
# It has its own port and its own login instead.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Open WebUI (browse to http://<your Home Assistant address>:8080)"
webui: "http://[HOST]:[PORT:8080]"
# Deliberately absent: homeassistant_api, hassio_api, auth_api, host_network, map, ingress. This add-on
# has no Home Assistant credential and no folder from Home Assistant; data reaches it only through
# the gateway's read-only API.
options:
  openrouter_api_key: ""
  terminal_host: ""
  terminal_port: 8000
  terminal_api_key: ""
  allow_signup: true
  allowed_models: []
schema:
  openrouter_api_key: password
  terminal_host: str
  terminal_port: port
  terminal_api_key: password
  allow_signup: bool
  allowed_models:
    - str
