name: SAGE Sandbox
version: "0.1.1"
slug: greenhouse_sandbox
description: Sandboxed shell where the agent writes and tests its own analysis tools (Open Terminal)
url: https://github.com/dancingcactus/smart-agricultural-greenhouse-engine
arch: [aarch64, amd64]
startup: application
boot: auto
# The base image starts tini itself, so Docker's init is not needed.
init: false
# Needed only to build the egress firewall (iptables); the image drops it again before the agent runs.
# Home Assistant grants it only while Protection mode is off for this add-on.
privileged:
  - NET_ADMIN
# Deliberately absent: homeassistant_api, hassio_api, auth_api, host_network, map, ports. The sandbox
# has no Home Assistant credential and no folder from Home Assistant, and nothing outside the
# add-on network can open a connection to it.
options:
  api_key: ""
  gateway_host: ""
  gateway_port: 8099
  gateway_key: ""
  extra_allowed_domains: []
schema:
  api_key: password
  gateway_host: str
  gateway_port: port
  gateway_key: password
  extra_allowed_domains:
    - str
