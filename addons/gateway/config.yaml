name: Greenhouse Gateway
version: "0.1.1"
slug: greenhouse_gateway
description: Read-only gateway between Home Assistant and the Greenhouse AI Operator
url: https://github.com/dancingcactus/smart-agricultural-greenhouse-engine
arch: [aarch64, amd64]
startup: application
boot: auto
homeassistant_api: true
map:
  - homeassistant_config:ro
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Gateway API (leave disabled unless you want to query it from your network)"
options:
  vm_url: "http://localhost:8428"
  metric_catalog_cron: "15 3 * * *"
  metric_catalog_lookback_days: 30
schema:
  vm_url: str
  metric_catalog_cron: str
  metric_catalog_lookback_days: int(1,365)
