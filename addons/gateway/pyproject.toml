[project]
name = "greenhouse-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx", "websockets", "pyyaml", "apscheduler<4", "fastapi"]

[project.optional-dependencies]
dev = ["pytest", "respx", "ruff"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
