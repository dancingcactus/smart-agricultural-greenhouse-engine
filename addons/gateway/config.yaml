name: SAGE Gateway
version: "0.9.1"
slug: greenhouse_gateway
description: Read-only gateway between Home Assistant and SAGE
url: https://github.com/dancingcactus/smart-agricultural-greenhouse-engine
arch: [aarch64, amd64]
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:sprout
panel_title: SAGE
panel_admin: true
init: false
homeassistant_api: true
map:
  - homeassistant_config:ro
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Gateway API (leave disabled unless you want to query it from your network)"
options:
  vm_url: "http://localhost:8428"
  vm_username: ""
  vm_password: ""
  api_key: ""
  as_of_override: ""
  metric_catalog_cron: "15 3 * * *"
  metric_catalog_lookback_days: 365
  catalog_ignore: []
  helper_snapshot_enabled: false
  helper_snapshot_cron: "5 */6 * * *"
  helper_snapshot_entities: []
  weather_entities: []
  weather_cron: "10 * * * *"
  weather_hourly_horizon_hours: 72
  config_snapshot_enabled: false
  config_snapshot_cron: "20 * * * *"
  protected_automations: []
schema:
  vm_url: str
  vm_username: str?
  vm_password: password?
  api_key: password?
  as_of_override: str?
  metric_catalog_cron: str
  metric_catalog_lookback_days: int(1,1100)
  catalog_ignore:
    - str
  helper_snapshot_enabled: bool
  helper_snapshot_cron: str
  helper_snapshot_entities:
    - str
  weather_entities:
    - str
  weather_cron: str
  weather_hourly_horizon_hours: int(6,240)
  config_snapshot_enabled: bool
  config_snapshot_cron: str
  protected_automations:
    - str
