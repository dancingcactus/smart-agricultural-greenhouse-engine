# Temperatures are in °F. The grower's decision: the targets are the installation's own live setpoints
# (the high/low temperature setpoint sensors and the humidity set point helper; ids are in the private
# install notes), not numbers written here. The agent reads their current values and must not substitute others.
season: {start: february, end: may}
source: live_setpoints
temperature_f: {day_min: null, day_max: null, night_min: null, night_max: null}   # unused: see source
relative_humidity_pct: {min: null, max: null}                                      # unused: see source
reference_petunia_unconfirmed:   # discussion aid only, never a target
  temperature_f: {day: "64-75", night: "54-61"}
  relative_humidity_pct: "50-70, avoid sustained >85 (botrytis risk)"
